[package]
name = "claude-code-openai-gateway"
version = "0.1.0"
edition = "2021"

[lib]
name = "claude_code_openai_gateway"
path = "src/lib.rs"

[[bin]]
name = "claude-code-openai-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
thiserror = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
